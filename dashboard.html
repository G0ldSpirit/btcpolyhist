<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Up/Down Tracker - Polymarket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .last-update {
            color: rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        /* STREAK CARD - Grande carte en haut */
        .streak-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .streak-title {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 15px;
        }

        .streak-value {
            font-size: 4em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .streak-type {
            font-size: 1.5em;
            color: #666;
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
        }

        .stat-subvalue {
            color: #999;
            font-size: 0.9em;
            margin-top: 5px;
        }

        /* MARKETS SECTION */
        .section-title {
            color: white;
            font-size: 1.8em;
            margin: 40px 0 20px 0;
            text-align: center;
        }

        .markets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .market-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .market-card.resolved {
            border-left: 5px solid #4CAF50;
        }

        .market-card.active {
            border-left: 5px solid #2196F3;
        }

        .market-time {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .market-date {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .market-result {
            font-size: 1.3em;
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
            text-align: center;
        }

        .market-prices {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .price-item {
            flex: 1;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
        }

        .price-up {
            background: #e8f5e9;
            color: #2e7d32;
            margin-right: 5px;
        }

        .price-down {
            background: #ffebee;
            color: #c62828;
            margin-left: 5px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 50px;
        }

        .error {
            background: #f44336;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }

        /* COLOR CLASSES */
        .green { color: #4CAF50; }
        .red { color: #f44336; }
        .blue { color: #2196F3; }
        .orange { color: #ff9800; }

        /* REFRESH BUTTON */
        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin: 20px auto;
            display: block;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 7px 20px rgba(0,0,0,0.3);
        }

        .refresh-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Bitcoin Up/Down Tracker</h1>
        <div class="subtitle">Polymarket - Marchés Horaires</div>
        <div class="last-update" id="lastUpdate">Chargement...</div>

        <button class="refresh-btn" onclick="loadData()">🔄 Actualiser</button>

        <!-- STREAK CARD -->
        <div id="streakCard"></div>

        <!-- STATS GRID -->
        <div id="statsGrid" class="stats-grid"></div>

        <!-- MARKETS -->
        <h2 class="section-title">📈 Marchés</h2>
        <div id="marketsGrid" class="markets-grid"></div>
    </div>

    <script>
        // 🔧 CORRECTION: Gestion robuste du cas stats null
        function displayStreak(stats) {
            const streakCard = document.getElementById('streakCard');

            // ✅ CORRECTION: Vérifier si stats existe et a des données
            if (!stats || stats.total_resolved === 0) {
                streakCard.innerHTML = `
                    <div class="streak-card">
                        <div class="streak-title">⏳ En attente de marchés résolus</div>
                        <div class="streak-type">Aucune série disponible pour le moment</div>
                    </div>
                `;
                return;
            }

            const color = stats.current_type === 'UP' ? 'green' : 'red';
            const emoji = stats.current_type === 'UP' ? '🟢' : '🔴';

            streakCard.innerHTML = `
                <div class="streak-card">
                    <div class="streak-title">Série Actuelle</div>
                    <div class="streak-value ${color}">${emoji} ${stats.current_streak}</div>
                    <div class="streak-type">${stats.current_type} consécutifs</div>
                </div>
            `;
        }

        // 🔧 CORRECTION: Gestion robuste du cas stats null
        function displayStats(stats) {
            const statsGrid = document.getElementById('statsGrid');

            // ✅ CORRECTION: Vérifier si stats existe
            if (!stats || stats.total_resolved === 0) {
                statsGrid.innerHTML = `
                    <div class="loading">
                        ⏳ En attente de marchés résolus...<br>
                        <small style="font-size: 0.6em;">Les statistiques apparaîtront une fois que des marchés seront fermés</small>
                    </div>
                `;
                return;
            }

            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Total Résolus</div>
                    <div class="stat-value blue">${stats.total_resolved}</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">🟢 UP</div>
                    <div class="stat-value green">${stats.up_count}</div>
                    <div class="stat-subvalue">${stats.up_percentage}%</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">🔴 DOWN</div>
                    <div class="stat-value red">${stats.down_count}</div>
                    <div class="stat-subvalue">${stats.down_percentage}%</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Records</div>
                    <div class="stat-value orange">${Math.max(stats.max_up_streak, stats.max_down_streak)}</div>
                    <div class="stat-subvalue">
                        UP: ${stats.max_up_streak} | DOWN: ${stats.max_down_streak}
                    </div>
                </div>
            `;
        }

        function displayMarkets(markets) {
            const marketsGrid = document.getElementById('marketsGrid');

            if (!markets || markets.length === 0) {
                marketsGrid.innerHTML = '<div class="loading">Aucun marché disponible</div>';
                return;
            }

            // Trier par date et heure (plus récent en premier)
            const sorted = [...markets].sort((a, b) => {
                if (a.date !== b.date) return b.date.localeCompare(a.date);
                return b.time.localeCompare(a.time);
            });

            marketsGrid.innerHTML = sorted.map(market => {
                const cardClass = market.closed ? 'resolved' : 'active';
                const status = market.closed ? '✅ Résolu' : '⏳ En cours';

                let content = `
                    <div class="market-card ${cardClass}">
                        <div class="market-time">${market.time.toUpperCase()}</div>
                        <div class="market-date">${market.date} - ${status}</div>
                `;

                if (market.closed && market.result) {
                    const isUp = market.result.includes('Up');
                    const resultClass = isUp ? 'green' : 'red';
                    content += `
                        <div class="market-result ${resultClass}">
                            ${market.result}
                        </div>
                    `;
                } else if (market.up_price !== null && market.up_price !== undefined) {
                    content += `
                        <div class="market-prices">
                            <div class="price-item price-up">
                                🟢 UP<br><strong>${(market.up_price * 100).toFixed(1)}%</strong>
                            </div>
                            <div class="price-item price-down">
                                🔴 DOWN<br><strong>${(market.down_price * 100).toFixed(1)}%</strong>
                            </div>
                        </div>
                    `;
                } else {
                    content += '<div class="market-result">⏳ Pas de liquidité</div>';
                }

                content += '</div>';
                return content;
            }).join('');
        }

        function formatDate(isoString) {
            if (!isoString) return 'Jamais';
            const date = new Date(isoString);
            return date.toLocaleString('fr-FR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        async function loadData() {
            try {
                const response = await fetch('btc_tracker_state.json');

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Mise à jour du timestamp
                document.getElementById('lastUpdate').textContent =
                    `Dernière mise à jour: ${formatDate(data.last_update)}`;

                // ✅ CORRECTION: Affichage sécurisé même si stats est null
                displayStreak(data.stats);
                displayStats(data.stats);
                displayMarkets(data.markets);

            } catch (error) {
                console.error('Erreur chargement:', error);
                document.getElementById('statsGrid').innerHTML = `
                    <div class="error">
                        ❌ Erreur de chargement<br>
                        <small>${error.message}</small><br>
                        <small>Assurez-vous que le tracker est lancé</small>
                    </div>
                `;
            }
        }

        // Charger les données au démarrage
        loadData();

        // Auto-refresh toutes les 30 secondes (optionnel)
        // setInterval(loadData, 30000);
    </script>
</body>
</html>
